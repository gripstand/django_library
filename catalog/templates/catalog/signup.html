{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h1>Register New User</h1>
    <form method="POST">
        {% for field in form %}
        <div class="col-6 text-start">{{field.label}}</div>
        <div class="col-6">{{field}}</div>
        {% endfor %}
        <br/>
        <input type="submit" class="btn btn-primary" value="Register">
    </form>
</div>
{% endblock %}
