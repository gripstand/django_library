{% extends 'base.html' %}
{% block content %}
<div class="container">

<form method="POST">
    <h3>Are you sure you want to delete {{object}}?</h3>
    {% csrf_token %}
<input type="submit" class="btn btn-danger" value="Confirm Delete">
<a href="{{ view.get_success_url }}" class="btn btn-secondary">Cancel</a>
</form>
</div>
{% endblock %}
