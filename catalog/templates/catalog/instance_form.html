{% extends 'base.html' %}
{% block content %}
<div class="container">
{% if author.pk %}    
    <h1>Update Instance</h1>
{% else %}
    <h1>Add Instance</h1>
{% endif %}
<p>The book id is {{book_id}}</p>
<form method="POST">
{% csrf_token %}
{% for field in form %}
<div class="col-6 text-start">{{field.label}}</div>
<div class="col-6">{{field}}</div>
{% endfor %}
<br/>
<input type="submit" value="Submit">
</form>
</div>  
{% endblock %}
